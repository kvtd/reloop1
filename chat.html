<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - Reloop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;800&family=Poppins:wght@300;400;600;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .chat-container {
            display: flex;
            height: calc(100vh - 120px);
            /* Adjust based on navbar height + margins */
            max-width: 1200px;
            margin: 100px auto 20px;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        .chat-sidebar {
            width: 300px;
            border-right: 1px solid #eee;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            padding: 20px;
            border-bottom: 1px solid #eee;
            font-weight: 600;
            font-size: 1.2rem;
        }

        .conversation-list {
            flex: 1;
            overflow-y: auto;
        }

        .conversation-item {
            padding: 15px 20px;
            border-bottom: 1px solid #f5f5f5;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .conversation-item:hover,
        .conversation-item.active {
            background: #f9f9f9;
        }

        .conversation-item img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }

        .conversation-info h4 {
            margin: 0;
            font-size: 0.95rem;
            color: #333;
        }

        .conversation-info p {
            margin: 2px 0 0;
            font-size: 0.8rem;
            color: #888;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 180px;
        }

        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #fafafa;
        }

        .chat-window-header {
            padding: 15px 20px;
            background: #fff;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            max-width: 70%;
            padding: 10px 15px;
            border-radius: 15px;
            font-size: 0.95rem;
            line-height: 1.4;
            position: relative;
        }

        .message.sent {
            align-self: flex-end;
            background: #6c5ce7;
            color: #fff;
            border-bottom-right-radius: 5px;
        }

        .message.received {
            align-self: flex-start;
            background: #fff;
            color: #333;
            border: 1px solid #eee;
            border-bottom-left-radius: 5px;
        }

        .chat-input-area {
            padding: 20px;
            background: #fff;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
        }

        .chat-input-area input {
            flex: 1;
            padding: 12px 20px;
            border: 1px solid #ddd;
            border-radius: 25px;
            outline: none;
            transition: border-color 0.3s;
        }

        .chat-input-area input:focus {
            border-color: #6c5ce7;
        }

        .send-btn {
            background: #6c5ce7;
            color: #fff;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }

        .send-btn:hover {
            transform: scale(1.05);
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #aaa;
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">reloop<span>.</span></a>
            <ul class="nav-links">
                <li><a href="index.html">หน้าแรก</a></li>
                <li><a href="index.html#shop">สินค้า</a></li>
                <li><a href="sell.html">ลงขาย</a></li>
            </ul>
            <div class="nav-icons">
                <a href="chat.html" class="btn-icon active"><i class="fas fa-comment-dots"></i></a>
                <a href="login.html" class="btn-icon"><i class="fas fa-user"></i></a>
                <a href="cart.html" class="cart-icon">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-count">0</span>
                </a>
            </div>
        </div>
    </nav>

    <div class="chat-container">
        <div class="chat-sidebar">
            <div class="chat-header">
                ข้อความ
            </div>
            <div class="conversation-list" id="conversationList">
                <!-- Conversations will be loaded here -->
            </div>
        </div>
        <div class="chat-main">
            <div class="chat-window-header" id="chatHeader"
                style="display: none; justify-content: space-between; border-bottom: 2px solid #eee;">
                <div style="display: flex; align-items: center; gap: 15px;">
                    <div
                        style="width: 45px; height: 45px; background: #6c5ce7; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 1.2rem;">
                        <i class="fas fa-user"></i>
                    </div>
                    <h4 id="chatPartnerName" style="margin:0; font-size: 1.1rem; color: #333;">User</h4>
                </div>

                <div
                    style="display: flex; align-items: center; gap: 12px; background: #fff; padding: 8px 15px; border-radius: 12px; border: 1px solid #e0e0e0; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
                    <div style="text-align: right;">
                        <span
                            style="display: block; font-size: 0.75rem; color: #666; margin-bottom: 2px;">กำลังสนทนาเรื่อง</span>
                        <span id="chatProductName" style="font-weight: 700; font-size: 0.95rem; color: #2d3436;">Product
                            Name</span>
                    </div>
                    <img src="" alt="" id="chatProductImage"
                        style="width: 45px; height: 45px; border-radius: 8px; object-fit: cover; border: 1px solid #eee;">
                </div>
            </div>
            <div class="chat-messages" id="chatMessages">
                <div class="empty-state">
                    <i class="far fa-comments"></i>
                    <p>เลือกบทสนทนาเพื่อเริ่มคุย</p>
                </div>
            </div>
            <div class="chat-input-area" id="chatInputArea" style="display: none;">
                <input type="text" id="messageInput" placeholder="พิมพ์ข้อความ...">
                <button class="send-btn" id="sendBtn"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <script src="chat.js"></script>
</body>

</html>
