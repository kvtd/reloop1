<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - Reloop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;800&family=Poppins:wght@300;400;600;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">reloop<span>.</span></a>
            <ul class="nav-links">
                <li><a href="index.html">หน้าแรก</a></li>
                <li><a href="index.html#shop">สินค้า</a></li>
                <li><a href="sell.html">ลงขาย</a></li>
            </ul>
            <div class="nav-icons">
                <a href="chat.html" class="btn-icon"><i class="fas fa-comment-dots"></i></a>
                <a href="register.html" class="btn-icon"><i class="fas fa-user-plus"></i></a>
            </div>
        </div>
    </nav>

    <div class="page-container">
        <div class="form-card">
            <h2>ยินดีต้อนรับกลับ</h2>
            <p>เข้าสู่ระบบเพื่อจัดการบัญชีของคุณ</p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">อีเมล หรือ ชื่อผู้ใช้</label>
                    <input type="text" id="email" required placeholder="กรอกอีเมลหรือชื่อผู้ใช้">
                </div>
                <div class="form-group">
                    <label for="password">รหัสผ่าน</label>
                    <input type="password" id="password" required placeholder="กรอกรหัสผ่านของคุณ">
                </div>

                <div class="form-options">
                    <div class="remember-me">
                        <input type="checkbox" id="remember">
                        <label for="remember">จดจำฉัน</label>
                    </div>
                    <a href="#" class="forgot-password">ลืมรหัสผ่าน?</a>
                </div>

                <button type="submit" class="btn btn-primary full-width">เข้าสู่ระบบ</button>
            </form>

            <div class="form-footer">
                <p>ยังไม่มีบัญชี? <a href="register.html">สมัครสมาชิก</a></p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
